<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">ggai quick start card</title>
  <desc id="desc">A quick start card showing five main ggai usage paths: session, edit, inspect, polish, and assets.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d9e1ea; stroke-width: 1.5; }
      .header { fill: #102033; }
      .muted { fill: #5f6f82; }
      .code { fill: #263548; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #ffffff; font-weight: 700; }
      .title { fill: #102033; font-weight: 800; }
      .small { font-size: 21px; }
      .body { font-size: 24px; }
      .h1 { font-size: 42px; font-weight: 800; }
      .h2 { font-size: 27px; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: none; stroke: #8091a5; stroke-width: 3; marker-end: url(#arrowhead); }
      .accent-blue { fill: #2f70d0; }
      .accent-teal { fill: #0f8b8d; }
      .accent-green { fill: #2a8c5e; }
      .accent-amber { fill: #b66b12; }
      .accent-red { fill: #bf4b4b; }
      .soft-blue { fill: #e8f1ff; }
      .soft-teal { fill: #e5f5f4; }
      .soft-green { fill: #e9f6ef; }
      .soft-amber { fill: #fff3df; }
      .soft-red { fill: #fdecec; }
      .chip { fill: #eef3f8; stroke: #d4dee9; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8091a5" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760" />

  <g class="sans">
    <text x="64" y="78" class="h1 title">ggai Quick Start</text>
    <text x="64" y="116" class="body muted">Pick the path by what you want to produce: editable ggplot first, polished image last.</text>

    <g transform="translate(64,154)">
      <rect class="panel" width="1152" height="118" rx="8" />
      <text x="28" y="43" class="h2 title">Start with real data</text>
      <text x="28" y="80" class="body muted">Put your data frame in R, then reference it in the prompt with <tspan class="mono code">@name</tspan>.</text>
      <rect x="760" y="28" width="350" height="60" rx="6" class="chip" />
      <text x="786" y="66" class="body mono code">car_data &lt;- mtcars</text>
    </g>

    <g transform="translate(64,318)">
      <rect class="panel" width="220" height="236" rx="8" />
      <rect class="accent-blue" width="220" height="52" rx="8" />
      <text x="20" y="35" class="body label">1 Session</text>
      <text x="20" y="86" class="h2 title">Create</text>
      <text x="20" y="121" class="small muted">Natural language to an editable</text>
      <text x="20" y="149" class="small muted">ggplot session.</text>
      <rect x="20" y="174" width="180" height="36" rx="6" class="soft-blue" />
      <text x="32" y="198" class="small mono code">ggai(...)</text>
    </g>

    <g transform="translate(297,318)">
      <rect class="panel" width="220" height="236" rx="8" />
      <rect class="accent-teal" width="220" height="52" rx="8" />
      <text x="20" y="35" class="body label">2 Edit</text>
      <text x="20" y="86" class="h2 title">Iterate</text>
      <text x="20" y="121" class="small muted">Move legends, add labels, tune</text>
      <text x="20" y="149" class="small muted">scales, facets, and themes.</text>
      <rect x="20" y="174" width="180" height="36" rx="6" class="soft-teal" />
      <text x="32" y="198" class="small mono code">gg_edit(s, ...)</text>
    </g>

    <g transform="translate(530,318)">
      <rect class="panel" width="220" height="236" rx="8" />
      <rect class="accent-green" width="220" height="52" rx="8" />
      <text x="20" y="35" class="body label">3 Inspect</text>
      <text x="20" y="86" class="h2 title">Review</text>
      <text x="20" y="121" class="small muted">Check code, specs, history,</text>
      <text x="20" y="149" class="small muted">and recorded artifacts.</text>
      <rect x="20" y="174" width="180" height="36" rx="6" class="soft-green" />
      <text x="32" y="198" class="small mono code">as_code(s)</text>
    </g>

    <g transform="translate(763,318)">
      <rect class="panel" width="220" height="236" rx="8" />
      <rect class="accent-amber" width="220" height="52" rx="8" />
      <text x="20" y="35" class="body label">4 Polish</text>
      <text x="20" y="86" class="h2 title">Redraw</text>
      <text x="20" y="121" class="small muted">Switch to image-level finish</text>
      <text x="20" y="149" class="small muted">when structure is right.</text>
      <rect x="20" y="174" width="180" height="36" rx="6" class="soft-amber" />
      <text x="32" y="198" class="small mono code">mode = "polish"</text>
    </g>

    <g transform="translate(996,318)">
      <rect class="panel" width="220" height="236" rx="8" />
      <rect class="accent-red" width="220" height="52" rx="8" />
      <text x="20" y="35" class="body label">5 Assets</text>
      <text x="20" y="86" class="h2 title">Generate</text>
      <text x="20" y="121" class="small muted">Create image edits, glyphs,</text>
      <text x="20" y="149" class="small muted">and diagram specs directly.</text>
      <rect x="20" y="174" width="180" height="36" rx="6" class="soft-red" />
      <text x="32" y="198" class="small mono code">ggai_edit_image()</text>
    </g>

    <path class="arrow" d="M284,436 L294,436" />
    <path class="arrow" d="M517,436 L527,436" />
    <path class="arrow" d="M750,436 L760,436" />
    <path class="arrow" d="M983,436 L993,436" />

    <g transform="translate(64,606)">
      <rect class="panel" width="1152" height="92" rx="8" />
      <text x="28" y="39" class="h2 title">Minimal workflow</text>
      <text x="28" y="68" class="small mono code">s &lt;- ggai("@car_data show mpg vs weight, color by cylinders")  |  s &lt;- gg_edit(s, "move legend to bottom")  |  plot(s)</text>
    </g>
  </g>
</svg>
